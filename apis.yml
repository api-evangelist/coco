aid: coco
name: Coco Robotics
description: 'Coco Robotics is a Santa Monica, California urban robotics company operating
  a fleet of zero-emission, remotely-supervised sidewalk delivery robots ("Cocobots")
  for last-mile food, grocery and retail delivery. Merchants do not integrate with
  Coco directly: Coco is consumed as a delivery service provider through Uber Eats,
  DoorDash, Wolt and Olo Dispatch, and the company publishes no developer portal, API
  documentation, SDKs or webhooks of its own. Its public software surface is limited
  to a marketing site, a customer order-tracking web app, and a GitHub organization
  of forked ROS and infrastructure tooling.'
