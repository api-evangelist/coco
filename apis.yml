  reason: no-developer-program
  detail: >-
    Coco has no developer surface at all — the 39-page Framer marketing site 404s on
    /developers and /api, no docs/developer/api subdomain resolves, and the only API
    host in its own code (api.cyanbot.com, hard-coded in the track.cocodelivery.com
    order-tracker bundle) is now NXDOMAIN; merchants reach Coco through Uber Eats,
    DoorDash, Wolt and Olo Dispatch rather than through a Coco API.
